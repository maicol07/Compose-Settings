name: Publish GitHub Packages

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: github-packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Compile samples
        run: ./gradlew :samples:shared:compileKotlinDesktop :samples:shared:compileKotlinJs :samples:shared:compileKotlinIosArm64 :samples:androidApp:assembleDebug --console=plain
      - name: Publish library modules
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          ./gradlew
          :ui-core:publishAllPublicationsToGitHubPackagesRepository
          :ui-tiles:publishAllPublicationsToGitHubPackagesRepository
          :ui-tiles-extended:publishAllPublicationsToGitHubPackagesRepository
          :ui-tiles-expressive:publishAllPublicationsToGitHubPackagesRepository
          -PgithubPackagesRepository=${{ github.repository }}
          -PlibGroup=com.github.maicol07.compose-settings
          -PlibVersion=3.3.0-material13.1
          --no-configuration-cache --console=plain
